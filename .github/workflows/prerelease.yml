# -----------------------------------------------------------------------
# Pre-Release Workflow
#
# Purpose:
#   Generate, lint, and validate all four Docker image variants (as in
#   ci.yml), additionally performing a real multi-platform docker buildx
#   build for each (no push to Docker Hub), then publish a GitHub
#   pre-release with release notes extracted from docs/Changelog.md and
#   the generated Dockerfile/asset artifacts attached.
#
# Trigger:
#   Push of a tag matching: v*.*.*-pre.*  (e.g. v1.1.2-pre.1, v1.1.2a-pre.1)
#
# Tag convention:
#   v1.1.2        full release, no image-only revision
#   v1.1.2a       full release, lowercase letter = image-only revision
#   v1.1.2a-pre.1 pre-release of the above; -pre.N always comes last
#
# Changelog lookup:
#   The docs/Changelog.md section header must match the tag's version
#   string verbatim (after stripping the leading 'v' and any trailing
#   '-pre.N'), letter suffix included, e.g. tag v1.1.2a-pre.1 looks up
#   header "# [1.1.2a]". If no matching section is found, GitHub's
#   auto-generated release notes are used instead.
#
# Related workflows:
#   ci.yml       — runs on every push/PR; validation only, no build
#   release.yml  — triggered by full release tags (v*.*.*, no suffix);
#                  also pushes to Docker Hub
# -----------------------------------------------------------------------

name: Pre-Release

on:
  push:
    tags:
      - 'v*.*.*-pre.*'

# contents: write is required to create and upload GitHub releases.
# packages/attestations/id-token: write are required because the called
# _build-variant.yml reusable workflow's job requests them (for the real
# multi-platform build here) — a reusable workflow's job can't request
# more permissions than its caller grants, so these must be listed here
# even though this workflow's own `publish` job only needs contents:write.
permissions:
  contents: write
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    name: "Build ${{ matrix.image_name }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: madsciencelab
            image_dir: build/standard
            dir_args: '--dir build/standard'
          - image_name: madsciencelab-plugins
            image_dir: build/plugins
            dir_args: '--dir build/standard --dir build/plugins'
          - image_name: madsciencelab-arm-none-eabi
            image_dir: build/arm-none-eabi
            dir_args: '--dir build/arm-none-eabi'
          - image_name: madsciencelab-arm-none-eabi-plugins
            image_dir: build/arm-none-eabi-plugins
            dir_args: '--dir build/arm-none-eabi --dir build/plugins --dir build/arm-none-eabi-plugins'
    uses: ./.github/workflows/_build-variant.yml
    with:
      image_name: ${{ matrix.image_name }}
      image_dir: ${{ matrix.image_dir }}
      dir_args: ${{ matrix.dir_args }}
      version: ${{ github.ref_name }}
      build: true
      push: false
    secrets: inherit

  publish:
    name: "Publish Pre-Release"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: 'Download all variant artifacts'
        uses: actions/download-artifact@v4
        with:
          # `pattern:` is a workaround to an artifact upload incompatibility with docker/build-push-action@v6
          # https://github.com/docker/build-push-action/issues/1167
          pattern: "madsciencelab*"
          path: artifacts

      # Strip the leading 'v' then take only the version core (including
      # any letter suffix), discarding the '-pre.N' marker, e.g.
      # v1.1.2a-pre.1 → 1.1.2a. Changelog entries are keyed on this string.
      - name: 'Extract Changelog Section for Release Notes'
        id: changelog
        shell: bash
        run: |
          SEMVER="${GITHUB_REF_NAME#v}"
          SEMVER="${SEMVER%%-*}"
          BODY_FILE="${RUNNER_TEMP}/release_body.md"

          echo "found=false" >> "$GITHUB_OUTPUT"

          if .github/workflows/extract_changelog.sh "${SEMVER}" "docs/Changelog.md" "${BODY_FILE}"; then
            EOF_MARKER="RELEASE_BODY_EOF_$(date +%s)"
            echo "body<<${EOF_MARKER}" >> "$GITHUB_OUTPUT"
            cat "${BODY_FILE}"         >> "$GITHUB_OUTPUT"
            echo "${EOF_MARKER}"       >> "$GITHUB_OUTPUT"
            echo "found=true"          >> "$GITHUB_OUTPUT"
          fi

      - name: 'Publish GitHub Pre-Release (changelog body)'
        if: steps.changelog.outputs.found == 'true'
        uses: ncipollo/release-action@v1
        with:
          prerelease: true
          allowUpdates: true
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          artifacts: "artifacts/*/*.zip"

      - name: 'Publish GitHub Pre-Release (auto-generated notes)'
        if: steps.changelog.outputs.found != 'true'
        uses: ncipollo/release-action@v1
        with:
          prerelease: true
          allowUpdates: true
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          name: ${{ github.ref_name }}
          generateReleaseNotes: true
          artifacts: "artifacts/*/*.zip"
